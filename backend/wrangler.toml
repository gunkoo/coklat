name = "api-user-system"
main = "worker.js"
compatibility_date = "2024-12-01"

# ============================================================
# Database: Cloudflare D1
# ============================================================
[[d1_databases]]
binding = "DB"
database_name = "db-user-system"
database_id = "176e30da-9f17-4c2a-999a-c77b40e2ca45"  # 🔴 ISI dengan database_id setelah membuat D1 database

# ============================================================
# Environment Variables
# ============================================================
[vars]
ENVIRONMENT = "production"

